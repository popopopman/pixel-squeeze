services:
  dev:
    build:
      context: .
      target: dev
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - pnpm_store:/pnpm/store
    environment:
      WATCHPACK_POLLING: "true"

  preview:
    build:
      context: .
      target: preview
    ports: ["8080:80"]
    profiles: ["preview"]

volumes:
  node_modules:
  next_cache:
  pnpm_store:
